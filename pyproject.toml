[project]
name = "kai"
version = "0.1.0"
description = "Multi-agent AI platform for the terminal — Agent Factory, MCP, Skills, local & cloud LLMs (Ollama / Gemini / DeepSeek), built with Textual"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Duncan Wen" }]
keywords = ["ai-agent", "llm", "mcp", "ollama", "tui", "textual", "terminal", "langfuse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Traditional)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals",
]
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.8.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
    "mcp>=1.27.1,<2",  # 2.x 改了 Tool / CallToolResult 欄位與 HTTP transport，遷移另案處理
    "textual[syntax]>=8.2.8",
    "openai>=3.58.0",
    "textual-autocomplete>=4.0.6",
    "ollama>=0.6.3",
    "pillow>=13.0.0",
    "edge-tts>=7.3.1",
    "textual-fspicker>=1.0.1",
    "pyyaml>=6.0.4",
]

[project.urls]
Homepage = "https://github.com/duncan-wen/kai"
Repository = "https://github.com/duncan-wen/kai"
Issues = "https://github.com/duncan-wen/kai/issues"
Changelog = "https://github.com/duncan-wen/kai/blob/main/CHANGELOG.md"
Security = "https://github.com/duncan-wen/kai/security/policy"

[project.optional-dependencies]
# Langfuse 可觀測性（選配）：未安裝或未設金鑰時追蹤完全停用
observability = [
    "langfuse>=5.2.0",
]
# 本地 / Docker TTS 引擎（kokoro、melotts、kokoro-api 去雜音）；edge-tts 與 azure-tts 不需要
tts = [
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.14.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "textual-dev>=1.8.0",
    "pytest>=9.2.0",
]

[tool.ruff.lint]
# 固定用 ruff 0.15 的預設規則；0.17 起預設規則擴大（UP / B / SIM / RUF …），要採用另案處理
select = ["E4", "E7", "E9", "F"]

# 編輯器的 Pyright 指向專案 venv，否則每個第三方 import 都報 unresolved
[tool.pyright]
venvPath = "."
venv = ".venv"
