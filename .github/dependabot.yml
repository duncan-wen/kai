# 每週檢查依賴更新；同一生態系的更新合併成一個 PR，減少噪音
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # mcp 2.x 改了 Tool / CallToolResult 欄位與 HTTP transport，要另外遷移，不跟著每週更新
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
